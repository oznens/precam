[project]
name = "precam"
version = "0.1.0"
description = "Solana meme alpha tracker: KOL tweets -> on-chain enrichment -> Telegram + dashboard"
requires-python = ">=3.11"
dependencies = [
    "twscrape>=0.17",
    "httpx>=0.27",
    "tenacity>=9.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlmodel>=0.0.22",
    "aiosqlite>=0.20",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "typer>=0.15",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "base58>=2.1",
    "python-dateutil>=2.9",
]

[project.scripts]
precam = "precam.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/precam"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]
