name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/kpss-turkce-quiz-app-3ml2fi
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Pages henüz açık değilse bu çalıştırma sırasında otomatik etkinleştir
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # Statik site deposu kökünden yayımlanır
          path: "."

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
