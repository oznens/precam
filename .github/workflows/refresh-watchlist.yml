name: refresh-watchlist

# Pulls fresh on-chain swap history for the watched wallets every 6 hours so
# the convergence scan has up-to-date trade data. Helius client rate-limits
# itself at 1 RPS (free tier), so 17 wallets × 5 pages = ~90s per run.
#
# Refresh-only of is_watched=True wallets keeps Helius usage bounded; new
# wallet discovery is a separate manual workflow_dispatch action.

on:
  schedule:
    - cron: "5 */6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "refresh | discover-then-refresh"
        default: refresh
        required: false

concurrency:
  group: precam-state
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: install package
        run: pip install -e .

      - name: restore db cache
        uses: actions/cache@v4
        with:
          path: data/runtime
          key: precam-db-${{ github.run_id }}
          restore-keys: |
            precam-db-

      - name: discover (optional)
        if: ${{ github.event.inputs.mode == 'discover-then-refresh' }}
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: |
          precam wallet discover --top-pools 20 --min-buys 1 --min-trade-size 500
          precam wallet discover-graduated --max-hours 72 --min-buys 2 --min-trade-size 500 --min-reserve 50000

      - name: refresh watched wallets
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: |
          python - <<'PY'
          import asyncio
          from sqlalchemy import select
          from precam.db import SessionLocal, Wallet, init_db
          from precam.workers.wallets import refresh_wallet

          async def main():
              await init_db()
              async with SessionLocal() as s:
                  res = await s.execute(select(Wallet.address).where(Wallet.is_watched.is_(True)))
                  addrs = [a for (a,) in res.all()]
              print(f"refreshing {len(addrs)} watched wallets")
              for a in addrs:
                  try:
                      await refresh_wallet(a)
                  except Exception as e:
                      print(f"  {a[:8]}.. failed: {e}")

          asyncio.run(main())
          PY
